<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECTS - Vistick Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="projects-grid.css">
</head>
<body>

    <div class="showcase-container">
        <header class="launch-fade-up">
            <h1 class="projects-layout-title">PROJECTS</h1>
        </header>

        <div class="showcase-grid launch-fade-up launch-delay">
            <div class="case-card" onclick="window.location.href='n-ice/index.html'">
                <div class="case-text-header">
                    <h2 class="case-title-main">N Degree Ice</h2>
                    <p class="case-title-sub">(Ice Cream Brand)</p>
                </div>
                <div class="case-video-frame">
                    <video autoplay loop muted playsinline 
                           oncontextmenu="return false;" 
                           controlsList="nodownload" 
                           class="case-video-element">
                        <source src="n-ice/n-ice.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="case-button-container">
                    <a href="n-ice/index.html" class="case-action-btn">VIEW IT</a>
                </div>
            </div>

            <div class="case-card" onclick="window.location.href='syntech/index.html'">
                <div class="case-text-header">
                    <h2 class="case-title-main">Syntech</h2>
                    <p class="case-title-sub">(Consumer Tech Brand)</p>
                </div>
                <div class="case-video-frame">
                    <video autoplay loop muted playsinline 
                           oncontextmenu="return false;" 
                           controlsList="nodownload" 
                           class="case-video-element">
                        <source src="syntech/syntech.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="case-button-container">
                    <a href="syntech/index.html" class="case-action-btn">VIEW IT</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>
